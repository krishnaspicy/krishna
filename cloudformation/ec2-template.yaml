AWSTemplateFormatVersion: '2010-09-09'
Description: 'EC2 Instance Deployment'

Parameters:
  InstanceType:
    Description: EC2 instance type
    Type: String
    Default: t2.micro
    AllowedValues: [t2.micro, t3.micro, t3.small]

Resources:
  MyEC2Instance:
    Type: AWS::EC2::Instance
    Properties:
      InstanceType: !Ref InstanceType
      ImageId: ami-0c55b159cbfafe1f0  # Amazon Linux 2 AMI (us-east-1)
      KeyName: krishna
      Tags:
        - Key: Name
          Value: GitHubActions-Deployed-EC2

Outputs:
  InstanceId:
    Description: The Instance ID
    Value: !Ref MyEC2Instance